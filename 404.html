<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page Not Found | Stackly Photography</title>
<meta name="description" content="This page could not be found. Head back to Stackly Photography.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --forest:#1f3d2b;
  --forest-deep:#152a1e;
  --forest-mid:#2c5a40;
  --sage:#a3b18a;
  --sage-soft:#c5d0b0;
  --sand:#e6d8ba;
  --cream:#f8f2e2;
  --bark:#4a3b2a;
  --ink:#1b2a20;
  --ink-soft:#5a5a48;
  --head:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Newsreader',Georgia,serif;
  --vm:20px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{min-height:100vh;min-height:100svh;font-family:var(--body);font-size:1.125rem;line-height:1.65;background:var(--cream);color:var(--ink);overflow-x:hidden;display:flex;align-items:center;justify-content:center;position:relative;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ===== BACKDROP ===== */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(2px)}
.blob.b1{width:520px;height:520px;left:-160px;top:-160px;background:radial-gradient(circle at 30% 30%,rgba(163,177,138,.55),rgba(163,177,138,.06))}
.blob.b2{width:440px;height:440px;right:-120px;bottom:-140px;background:radial-gradient(circle at 60% 40%,rgba(230,216,186,.95),rgba(230,216,186,.15))}
.blob.b3{width:260px;height:260px;right:14%;top:8%;background:radial-gradient(circle at 40% 40%,rgba(31,61,43,.14),rgba(31,61,43,.02))}
.dot{position:absolute;border-radius:50%;background:var(--sage);opacity:.55}
.ring{position:absolute;border-radius:50%;border:2px dashed rgba(31,61,43,.2)}

/* viewfinder corner marks (fixed to the screen corners, clear of the content) */
.vf{position:fixed;width:38px;height:38px;border:2px solid var(--forest);opacity:.45;z-index:1;pointer-events:none}
.vf.tl{top:var(--vm);left:var(--vm);border-right:0;border-bottom:0}
.vf.tr{top:var(--vm);right:var(--vm);border-left:0;border-bottom:0}
.vf.bl{bottom:var(--vm);left:var(--vm);border-right:0;border-top:0}
.vf.br{bottom:var(--vm);right:var(--vm);border-left:0;border-top:0}

/* ===== CONTENT ===== */
.wrap{position:relative;z-index:2;width:100%;max-width:740px;padding:84px 28px;text-align:center}
.code{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,18px);font-family:var(--head);font-weight:800;line-height:1;font-size:clamp(96px,22vw,210px);letter-spacing:-.04em;margin-bottom:8px}
.code .d{display:inline-block;will-change:transform,opacity}
.code .four{background:linear-gradient(160deg,var(--forest),var(--forest-mid) 70%,var(--sage));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .02em}
.lens{position:relative;display:inline-block;width:.74em;height:.74em;border-radius:50%;background:radial-gradient(circle at 32% 28%,var(--forest-mid),var(--forest) 55%,var(--forest-deep));box-shadow:0 18px 40px rgba(21,42,30,.32),inset 0 -10px 24px rgba(0,0,0,.25),inset 0 0 0 .04em rgba(248,242,226,.14)}
.lens::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px dashed rgba(163,177,138,.95);animation:spin 16s linear infinite}
.lens svg{position:absolute;inset:0;margin:auto;width:66%;height:66%;fill:none;stroke:var(--cream);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.lens svg polygon{fill:rgba(248,242,226,.2)}
.lens .iris{transform-origin:50% 50%;animation:focus 6s ease-in-out infinite}
.lens::before{content:"";position:absolute;top:14%;left:20%;width:20%;height:12%;border-radius:50%;background:rgba(248,242,226,.35);transform:rotate(-30deg);filter:blur(1px)}

.eyebrow{font-family:var(--head);text-transform:uppercase;letter-spacing:.2em;font-size:.8rem;font-weight:600;color:var(--forest);display:inline-flex;align-items:center;gap:10px;margin-bottom:14px}
.eyebrow::before,.eyebrow::after{content:"";width:28px;height:2px;background:var(--sage);display:inline-block}
h1{font-family:var(--head);font-weight:800;letter-spacing:-.02em;color:var(--forest);font-size:clamp(1.9rem,4.8vw,3rem);line-height:1.1;margin-bottom:14px}
h1 em{font-family:var(--body);font-style:italic;font-weight:500;color:var(--bark)}
p.lead{color:var(--ink-soft);font-size:1.15rem;line-height:1.65;max-width:520px;margin:0 auto 34px}

.actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:.6rem;padding:.9rem 1.8rem;border-radius:999px;font-family:var(--head);font-weight:600;font-size:1rem;position:relative;overflow:hidden;transition:transform .35s ease,box-shadow .35s ease,background .35s ease,color .35s ease,border-color .35s ease}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s ease}
.btn-outline{background:transparent;color:var(--forest);border:2px solid var(--forest)}
.btn-outline:hover{background:var(--forest);color:var(--cream);transform:translateY(-3px);box-shadow:0 12px 24px rgba(31,61,43,.25)}
.btn-outline:hover svg{transform:translateX(-4px)}
.btn-primary{background:var(--sage);color:var(--forest-deep);border:2px solid var(--sage)}
.btn-primary:hover{background:var(--forest);border-color:var(--forest);color:var(--cream);transform:translateY(-3px);box-shadow:0 12px 24px rgba(31,61,43,.3)}
.btn-primary:hover svg{transform:scale(1.15)}
.btn:active{transform:translateY(-1px) scale(.98)}
:focus-visible{outline:3px solid var(--sage);outline-offset:3px}

/* ===== PAGE TRANSITION CURTAIN ===== */
.curtain{position:fixed;inset:0;z-index:50;background:var(--forest);transform:translateY(100%);pointer-events:none;border-radius:50% 50% 0 0 / 12% 12% 0 0}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes focus{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(60deg) scale(.9)}}

/* No-GSAP fallback: gentle CSS entrance */
.no-gsap .anim{animation:fadeUp .8s ease both}
.no-gsap .anim:nth-child(2){animation-delay:.15s}
.no-gsap .anim:nth-child(3){animation-delay:.3s}
.no-gsap .anim:nth-child(4){animation-delay:.45s}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .lens::after,.lens .iris{animation:none}
}
@media (max-width:480px){
  :root{--vm:12px}
  .vf{width:26px;height:26px}
  .wrap{padding:72px 24px}
  .btn{width:100%;justify-content:center}
  .actions{flex-direction:column}
}
/* PRELOADER — simple */
html.pl-lock,html.pl-lock body{overflow:hidden}
.preloader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:var(--forest,#1f3d2b);transition:opacity .5s ease,visibility .5s ease}
.preloader.pl-hide{opacity:0;visibility:hidden}
.pl-logo{width:clamp(130px,22vw,180px);height:auto;background:transparent;animation:pl-pulse 1.6s ease-in-out infinite}
.pl-bar{width:clamp(120px,20vw,160px);height:3px;border-radius:3px;background:rgba(248,242,226,.18);overflow:hidden}
.pl-bar::before{content:"";display:block;height:100%;width:40%;border-radius:3px;background:var(--sage,#a3b18a);animation:pl-slide 1.1s ease-in-out infinite}
@keyframes pl-pulse{50%{opacity:.6;transform:scale(.97)}}
@keyframes pl-slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.pl-logo,.pl-bar::before{animation:none}}
</style>
</head>
<body>
<!-- PRELOADER -->
<div class="preloader" id="preloader" role="status" aria-label="Loading">
  <img class="pl-logo" src="stackly-logo.webp" alt="Stackly Photography" width="180" height="60">
  <div class="pl-bar"></div>
</div>
<noscript><style>.preloader{display:none}html.pl-lock,html.pl-lock body{overflow:auto}</style></noscript>
<script>document.documentElement.classList.add('pl-lock');</script>


<div class="bg" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="ring" style="width:340px;height:340px;left:6%;bottom:8%"></span>
  <span class="ring" style="width:220px;height:220px;right:8%;top:22%"></span>
  <span class="dot" style="width:14px;height:14px;left:18%;top:26%"></span>
  <span class="dot" style="width:10px;height:10px;left:78%;top:64%;background:var(--bark)"></span>
  <span class="dot" style="width:18px;height:18px;left:64%;top:14%"></span>
  <span class="dot" style="width:9px;height:9px;left:30%;top:78%;background:var(--forest)"></span>
  <span class="dot" style="width:12px;height:12px;left:88%;top:40%"></span>
</div>
<span class="vf tl" aria-hidden="true"></span><span class="vf tr" aria-hidden="true"></span><span class="vf bl" aria-hidden="true"></span><span class="vf br" aria-hidden="true"></span>

<main class="wrap">
  <div class="code anim" aria-label="404" role="img">
    <span class="d four">4</span>
    <span class="d" id="orb"><span class="lens"><svg viewBox="0 0 100 100" aria-hidden="true"><g class="iris"><circle cx="50" cy="50" r="44"/><path d="M50.0 35.0L20.09 17.73"/><path d="M62.99 42.5L62.99 7.96"/><path d="M62.99 57.5L92.9 40.23"/><path d="M50.0 65.0L79.91 82.27"/><path d="M37.01 57.5L37.01 92.04"/><path d="M37.01 42.5L7.1 59.77"/><polygon points="50.00,35.00 62.99,42.50 62.99,57.50 50.00,65.00 37.01,57.50 37.01,42.50"/></g></svg></span></span>
    <span class="d four">4</span>
  </div>

  <div class="anim"><span class="eyebrow">Error 404</span></div>
  <h1 class="anim">Oops! This frame went <em>out of focus</em>.</h1>
  <p class="lead anim">The page you are looking for may have moved, been renamed, or never existed. Let us bring you back into the picture.</p>

  <div class="actions anim">
    <button type="button" class="btn btn-outline" id="goBack">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
      Go Back
    </button>
    <a href="index.html" class="btn btn-primary" id="goHome">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      Back to Home
    </a>
  </div>
</main>

<div class="curtain" id="curtain"></div>

<script>
/* hold GSAP intro animations until the preloader opens */
(function(){try{if(window.gsap&&document.getElementById('preloader')){gsap.globalTimeline.pause();window.__plResume=function(){try{gsap.globalTimeline.resume()}catch(e){}}}}catch(e){}})();
</script>
<script>
(function(){
  var curtain = document.getElementById('curtain');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- page-leave transition, then navigate ---------- */
  function leave(go){
    if(reduce || typeof gsap === 'undefined'){ go(); return; }
    gsap.fromTo(curtain, {yPercent:100}, {yPercent:0, duration:.6, ease:'power3.inOut', onComplete:go});
  }
  document.getElementById('goBack').addEventListener('click', function(){
    leave(function(){
      if(window.history.length > 1){ window.history.back(); }
      else { window.location.href = 'index.html'; }
    });
  });
  document.getElementById('goHome').addEventListener('click', function(e){
    e.preventDefault();
    var href = this.getAttribute('href');
    leave(function(){ window.location.href = href; });
  });
  /* returning through the back/forward cache: reset the curtain */
  window.addEventListener('pageshow', function(ev){
    if(ev.persisted && typeof gsap !== 'undefined'){ gsap.set(curtain, {yPercent:100}); }
  });

  /* ---------- entrance animation ---------- */
  if(typeof gsap === 'undefined'){
    document.documentElement.classList.add('no-gsap');
    return;
  }
  gsap.set(curtain, {yPercent:100});
  if(reduce) return;

  var fours = document.querySelectorAll('.d.four');
  var orb = document.getElementById('orb');
  var tl = gsap.timeline({defaults:{ease:'power3.out'}});
  tl.from(fours[0], {x:-120, opacity:0, rotate:-14, duration:1})
    .from(fours[1], {x:120, opacity:0, rotate:14, duration:1}, '<')
    .from(orb, {scale:0, opacity:0, rotate:-180, duration:1.1, ease:'back.out(1.7)'}, '-=.7')
    .from('.eyebrow', {y:20, opacity:0, duration:.6}, '-=.4')
    .from('h1', {y:30, opacity:0, duration:.7}, '-=.35')
    .from('.lead', {y:24, opacity:0, duration:.7}, '-=.5')
    .from('.actions .btn', {y:28, opacity:0, scale:.92, duration:.6, stagger:.14, ease:'back.out(1.6)'}, '-=.45')
    .from('.vf', {opacity:0, scale:1.6, duration:.9, stagger:.08}, 0.2);

  /* ---------- ambient motion ---------- */
  gsap.to('.blob.b1', {x:60, y:40, duration:9, repeat:-1, yoyo:true, ease:'sine.inOut'});
  gsap.to('.blob.b2', {x:-50, y:-40, duration:11, repeat:-1, yoyo:true, ease:'sine.inOut'});
  gsap.to('.blob.b3', {x:-30, y:50, duration:8, repeat:-1, yoyo:true, ease:'sine.inOut'});
  gsap.utils.toArray('.dot').forEach(function(d,i){
    gsap.to(d, {y:'+='+gsap.utils.random(-30,30), x:'+='+gsap.utils.random(-20,20), duration:gsap.utils.random(3,6), repeat:-1, yoyo:true, ease:'sine.inOut', delay:i*.2});
  });
  gsap.to('.ring', {rotate:360, duration:40, repeat:-1, ease:'none'});
  gsap.to(orb, {y:-12, duration:2.4, repeat:-1, yoyo:true, ease:'sine.inOut', delay:1.6});

  /* ---------- subtle mouse parallax ---------- */
  var code = document.querySelector('.code');
  window.addEventListener('mousemove', function(e){
    var x = (e.clientX / window.innerWidth - .5), y = (e.clientY / window.innerHeight - .5);
    gsap.to(code, {x:x*18, y:y*12, duration:.8, ease:'power2.out', overwrite:'auto'});
    gsap.to('.bg', {x:-x*20, y:-y*14, duration:1.2, ease:'power2.out', overwrite:'auto'});
  });
})();
</script>
<script>
/* PRELOADER logic */
(function(){
  var pre=document.getElementById('preloader');
  if(!pre)return;
  var start=performance.now(),done=false;
  function hide(){
    if(done)return;done=true;
    pre.classList.add('pl-hide');
    document.documentElement.classList.remove('pl-lock');
    if(window.__plResume)window.__plResume();
    setTimeout(function(){if(pre.parentNode)pre.parentNode.removeChild(pre);},600);
  }
  function ready(){setTimeout(hide,Math.max(0,700-(performance.now()-start)));}
  if(document.readyState==='complete')ready();else window.addEventListener('load',ready);
  setTimeout(hide,6000);
})();
</script>

</body>
